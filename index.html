<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000103">
  <title>CHRONO-POLYHEDRON 3000: Supernova Edition</title>
  <style>
    :root {
      --bg: #000103;
      --primary: #00f3ff;
      --secondary: #ff007f;
      --gold: #ffd700;
      --purple: #9d4edd;
      --green: #00ff88;
      --panel: rgba(5, 8, 18, 0.92);
      --font: 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); color: #fff; touch-action: none; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    .hud { position: absolute; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; width: 100%; height: 100%; }
    .hud * { pointer-events: auto; }
    .top-wrapper { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; flex-wrap: wrap; }
    .title-box { background: var(--panel); border: 1px solid rgba(0, 243, 255, 0.55); padding: 8px 14px; border-radius: 12px; backdrop-filter: blur(12px); }
    h1 { font-size: 0.95rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--primary); text-shadow: 0 0 12px var(--primary); }
    .sub { font-size: 0.58rem; color: #8a99ad; margin-top: 2px; }
    .sec-badge { color: var(--gold); font-weight: bold; }
    .top-stats-bar { background: var(--panel); border: 1px solid rgba(255, 215, 0, 0.45); padding: 7px 14px; border-radius: 12px; backdrop-filter: blur(12px); display: flex; gap: 16px; align-items: center; }
    .stat-item { font-size: 0.65rem; display: flex; flex-direction: column; align-items: flex-end; }
    .stat-item span { color: #8a99ad; font-size: 0.5rem; text-transform: uppercase; }
    .stat-item strong { color: #fff; font-size: 0.78rem; font-variant-numeric: tabular-nums; }
    .player-bar { background: var(--panel); border: 1px solid rgba(255, 0, 127, 0.5); border-left: 3px solid var(--secondary); padding: 6px 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; }
    .player-bar label { font-size: 0.62rem; color: var(--secondary); text-transform: uppercase; font-weight: bold; }
    .player-bar input { background: rgba(0, 0, 0, 0.65); border: 1px solid rgba(0, 243, 255, 0.45); color: var(--gold); padding: 4px 10px; border-radius: 6px; font-family: inherit; font-size: 0.75rem; font-weight: bold; width: 130px; user-select: text; }
    footer { display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; margin-bottom: 6px; }
    .time-control { background: var(--panel); padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(0, 243, 255, 0.5); display: flex; align-items: center; gap: 12px; width: 100%; max-width: 440px; justify-content: center; }
    .time-slider { flex: 1; accent-color: var(--primary); cursor: pointer; height: 20px; }
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 860px; }
    .btn { background: rgba(0, 243, 255, 0.12); border: 1px solid var(--primary); color: var(--primary); padding: 9px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.68rem; font-weight: bold; text-transform: uppercase; flex: 1; min-width: 110px; text-align: center; }
    .btn:hover { background: var(--primary); color: #000103; }
    .btn-gold { border-color: var(--gold); color: var(--gold); }
    #toast { position: fixed; top: 115px; left: 50%; transform: translateX(-50%); background: rgba(5, 8, 18, 0.96); border: 1px solid var(--primary); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 0.78rem; z-index: 95; display: none; text-align: center; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="toast"></div>

  <div class="hud">
    <div class="top-wrapper">
      <header>
        <div class="title-box">
          <h1>Chrono-Polyhedron</h1>
          <div class="sub">Andromeda M31 • <span class="sec-badge">OMEGA 36</span></div>
        </div>
        <div class="top-stats-bar">
          <div class="player-bar">
            <label for="player-name-input">Agent:</label>
            <input type="text" id="player-name-input" value="AGENT-3000" maxlength="18">
          </div>
          <div class="stat-item">
            <span>Čas</span>
            <strong id="timer-val" style="color:var(--green);">00:00.0</strong>
          </div>
          <div class="stat-item">
            <span>Fáza</span>
            <strong id="phase-val" style="color:var(--primary);">t0</strong>
          </div>
          <div class="stat-item">
            <span>Stabilizácia</span>
            <strong id="stab-val" style="color:var(--gold);">0%</strong>
          </div>
          <div class="stat-item">
            <span>Kvantová Rezonancia</span>
            <strong id="resonance-val" style="color: #d8a7ff;">SYNAPSE 1.0x</strong>
          </div>
          <div class="stat-item">
            <span>Ťahy / IQ</span>
            <strong id="moves-val">0 <span style="color:#8a99ad;">(175)</span></strong>
          </div>
        </div>
      </header>
    </div>
    <footer>
      <div class="time-control">
        <span style="font-size: 0.7rem; color: #8a99ad;">t-1</span>
        <input type="range" min="-1" max="1" value="0" step="1" class="time-slider" id="time-slider">
        <span style="font-size: 0.7rem; color: #8a99ad;">t+1</span>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="location.reload()">Reštart Hry</button>
      </div>
    </footer>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const light = new THREE.PointLight(0x00f3ff, 2, 50);
    light.position.set(10, 10, 10);
    scene.add(light);

    // Hlavný 3D Kvantový Polyéder
    const geometry = new THREE.IcosahedronGeometry(2, 0);
    const material = new THREE.MeshPhongMaterial({ color: 0xff007f, emissive: 0xff007f, emissiveIntensity: 0.5, wireframe: true });
    const polyhedron = new THREE.Mesh(geometry, material);
    scene.add(polyhedron);

    // Animačná slučka
    function animate() {
      requestAnimationFrame(animate);
      polyhedron.rotation.x += 0.005;
      polyhedron.rotation.y += 0.008;
      renderer.render(scene, camera);
    }
    animate();

    // Dynamická zmena údajov pre hráča
    let moves = 0;
    window.addEventListener('click', () => {
      moves++;
      document.getElementById('moves-val').innerHTML = `${moves} <span style="color:#8a99ad;">(IQ ${185 - moves})</span>`;
      document.getElementById('stab-val').innerText = `${Math.min(100, moves * 10)}%`;
      document.getElementById('resonance-val').innerText = `SYNAPSE ${(1.0 + moves * 0.2).toFixed(1)}x`;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
