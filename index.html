<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CHRONO-POLYHEDRON 3000: Sci-Fi Aura Edition</title>
  <style>
    :root {
      --bg: #010206;
      --primary: #00f3ff;
      --secondary: #ff007f;
      --gold: #ffd700;
      --purple: #9d4edd;
      --panel: rgba(6, 10, 22, 0.85);
      --font: 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); color: #fff; touch-action: none; }

    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

    /* HUD Overlay */
    .hud { position: absolute; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; width: 100%; height: 100%; }
    .hud * { pointer-events: auto; }

    header { display: flex; justify-content: space-between; align-items: center; gap: 6px; width: 100%; }
    
    .title-box {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.6);
      padding: 6px 12px;
      border-radius: 10px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    }

    h1 { font-size: 0.92rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--primary); text-shadow: 0 0 12px var(--primary); }
    .sub { font-size: 0.55srem; color: #8a99ad; margin-top: 1px; }

    /* Kompaktné štatistiky HORE */
    .top-stats-compact {
      background: var(--panel);
      border: 1px solid rgba(255, 215, 0, 0.5);
      padding: 6px 10px;
      border-radius: 10px;
      backdrop-filter: blur(12px);
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.2);
    }
    .stat-item { font-size: 0.65rem; display: flex; flex-direction: column; align-items: flex-end; }
    .stat-item span { color: #8a99ad; font-size: 0.52rem; text-transform: uppercase; }
    .stat-item strong { color: #fff; font-size: 0.72rem; }

    /* Desktopové štatistiky vpravo */
    .side-panel { position: absolute; right: 12px; top: 75px; display: flex; flex-direction: column; gap: 8px; width: 220px; z-index: 10; }
    .stat-card {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 3px solid var(--primary);
      padding: 10px 14px;
      border-radius: 10px;
      backdrop-filter: blur(15px);
    }
    .stat-label { font-size: 0.62rem; color: #8a99ad; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 1.05rem; font-weight: bold; color: #fff; margin-top: 3px; text-shadow: 0 0 8px rgba(255,255,255,0.4); }

    .strain-bar-bg { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; margin-top: 6px; overflow: hidden; }
    .strain-bar-fill { height: 100%; width: 15%; background: linear-gradient(90deg, #00f3ff, #ff007f, #ffd700); transition: width 0.3s; }

    .player-input-box { display: flex; gap: 6px; margin-top: 4px; }
    .player-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 243, 255, 0.4);
      color: var(--gold);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      outline: none;
    }

    /* Spodný ovládací panel */
    footer { display: flex; flex-direction: column; gap: 6px; align-items: center; width: 100%; margin-bottom: 4px; }
    
    .time-control {
      background: var(--panel);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(0, 243, 255, 0.5);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 400px;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0,243,255,0.25);
    }
    .time-slider { flex: 1; accent-color: var(--primary); cursor: pointer; height: 20px; }

    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 640px; }
    
    .btn {
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.68rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      flex: 1;
      min-width: 115px;
    }
    .btn:hover, .btn:active { background: var(--primary); color: #010206; box-shadow: 0 0 20px var(--primary); transform: translateY(-1px); }
    .btn-secondary { border-color: var(--secondary); color: var(--secondary); background: rgba(255, 0, 127, 0.12); }
    .btn-secondary:hover, .btn-secondary:active { background: var(--secondary); color: #fff; box-shadow: 0 0 20px var(--secondary); }
    .btn-gold { border-color: var(--gold); color: var(--gold); background: rgba(255, 215, 0, 0.12); }
    .btn-gold:hover, .btn-gold:active { background: var(--gold); color: #010206; box-shadow: 0 0 25px var(--gold); }

    @media (max-width: 768px) {
      .side-panel { display: none; }
      .btn { padding: 9px 4px; font-size: 0.63rem; min-width: 47%; }
      .top-stats-compact { padding: 4px 8px; gap: 7px; }
      h1 { font-size: 0.82rem; }
    }

    #toast {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 10, 22, 0.95);
      border: 1px solid var(--primary);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.75rem;
      z-index: 90;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
      display: none;
    }

    /* Modal */
    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(1, 2, 6, 0.92); backdrop-filter: blur(20px); z-index: 100; display: none; justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background: #060a14; border: 1px solid var(--gold); border-radius: 16px; padding: 20px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 0 45px rgba(255, 215, 0, 0.4); }
    .modal-title { color: var(--gold); font-size: 1.25rem; letter-spacing: 1.5px; margin-bottom: 8px; text-transform: uppercase; text-shadow: 0 0 12px var(--gold); }
    #cert-canvas-container { width: 100%; height: 210px; margin: 10px 0; border-radius: 10px; border: 1px solid rgba(255, 215, 0, 0.35); background: #010206; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="toast"></div>

  <div class="hud">
    <header>
      <div class="title-box">
        <h1>Chrono-Polyhedron</h1>
        <div class="sub">Sci-Fi Aura Edition • 3D</div>
      </div>

      <div class="top-stats-compact">
        <div class="stat-item">
          <span>Dimenzia</span>
          <strong id="phase-val-top" style="color:var(--primary);">PRESENT (t₀)</strong>
        </div>
        <div class="stat-item">
          <span>Polyéder</span>
          <strong id="stab-val-top" style="color:var(--gold);">0%</strong>
        </div>
        <div class="stat-item">
          <span>Ťahy</span>
          <strong id="moves-val-top">0</strong>
        </div>
      </div>
    </header>

    <!-- Desktopové štatistiky vpravo hore -->
    <div class="side-panel">
      <div class="stat-card">
        <div class="stat-label">Volací znak riešiteľa</div>
        <div class="player-input-box">
          <input type="text" id="player-name-input" class="player-input" value="AGENT-3000" maxlength="18">
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Časová dimenzia</div>
        <div class="stat-value" id="phase-val" style="color: var(--primary);">PRESENT (t₀)</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Stabilizácia Polyédra (36 uzlov)</div>
        <div class="stat-value" id="stab-val">0%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Brain Strain (IQ)</div>
        <div class="stat-value" id="strain-val">IQ 175</div>
        <div class="strain-bar-bg"><div class="strain-bar-fill" id="strain-fill"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Počet ťahov</div>
        <div class="stat-value" id="moves-val">0</div>
      </div>
    </div>

    <!-- Spodný panel -->
    <footer>
      <div class="time-control">
        <span style="font-size: 0.7rem; color: #8a99ad; font-weight: bold;">t₋₁</span>
        <input type="range" min="-1" max="1" value="0" step="1" class="time-slider" id="time-slider">
        <span style="font-size: 0.7rem; color: #8a99ad; font-weight: bold;">t₊₁</span>
      </div>

      <div class="btn-group">
        <button class="btn" id="reset-cam-btn">Reset Pohľadu</button>
        <button class="btn btn-secondary" id="oracle-btn">AI Orákulum</button>
        <button class="btn btn-secondary" id="challenge-btn">Virálna Výzva</button>
        <button class="btn btn-gold" id="rage-btn">Rage Quit</button>
      </div>
    </footer>
  </div>

  <!-- Certificate Modal -->
  <div class="modal" id="cert-modal">
    <div class="modal-content">
      <div class="modal-title">🏆 Polyhedron Master 🏆</div>
      <p style="font-size: 0.8rem; color: #a0aec0;">Stabilizovali ste všetkých 36 kvantových uzlov polyédra!</p>
      
      <div id="cert-canvas-container"></div>

      <div style="display: flex; gap: 8px; justify-content: center; margin-top: 10px;">
        <button class="btn btn-gold" id="download-cert-btn">Stiahnuť 3D Certifikát (PNG)</button>
        <button class="btn" id="close-cert-btn">Zatvoriť</button>
      </div>
    </div>
  </div>

  <script>
    const QuantumPolyhedronEngine = (function() {
      const _sessionSig = Math.random().toString(36).substring(2) + Date.now().toString(36);
      let _player = "AGENT-3000";
      let _timePhase = 0;
      let _moves = 0;
      let _isSolved = false;
      let _toastTimer = null;

      // 12 hlavných vrcholov ikosaédra pre komplexný Polyéder
      const phi = (1 + Math.sqrt(5)) / 2;
      const scale = 1.8;
      const rawPoints = [
        [-1, phi, 0], [1, phi, 0], [-1, -phi, 0], [1, -phi, 0],
        [0, -1, phi], [0, 1, phi], [0, -1, -phi], [0, 1, -phi],
        [phi, 0, -1], [phi, 0, 1], [-phi, 0, -1], [-phi, 0, 1]
      ];

      const _nodes = rawPoints.map((pt, idx) => ({
        id: idx,
        pos: [pt[0] * scale, pt[1] * scale, pt[2] * scale],
        phaseColors: [0x00f3ff, 0xff007f, 0xffd700],
        active: [false, false, false]
      }));

      // Automatické prepojenie blízkych uzlov do sieťovej geometrie polyédra
      const _connections = [];
      for(let i = 0; i < _nodes.length; i++) {
        for(let j = i + 1; j < _nodes.length; j++) {
          const dist = Math.hypot(
            _nodes[i].pos[0] - _nodes[j].pos[0],
            _nodes[i].pos[1] - _nodes[j].pos[1],
            _nodes[i].pos[2] - _nodes[j].pos[2]
          );
          if (dist < 3.2) {
            _connections.push([i, j]);
          }
        }
      }

      function showToast(msg, duration = 3800) {
        const el = document.getElementById('toast');
        el.innerText = msg;
        el.style.display = 'block';
        if (_toastTimer) clearTimeout(_toastTimer);
        _toastTimer = setTimeout(() => { el.style.display = 'none'; }, duration);
      }

      const AudioEngine = {
        ctx: null,
        init() {
          if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
          if (!this.ctx) return;
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
          } catch(e){}
        },
        playLaser() {
          if (!this.ctx) return;
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1000, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.25);
          } catch(e){}
        },
        playFanfare() {
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
          notes.forEach((n, i) => {
            setTimeout(() => this.playTone(n, 'triangle', 0.45, 0.15), i * 110);
          });
        }
      };

      return {
        init() {
          this.setupThreeJS();
          this.setupEvents();
          this.updateHUD();
          this.adjustCameraForScreen();
        },

        adjustCameraForScreen() {
          const isMobile = window.innerWidth <= 768;
          const dist = isMobile ? 11.8 : 9.5;
          this.camera.position.set(dist * 0.65, dist * 0.58, dist);
          this.camera.lookAt(0, 0, 0);
        },

        setupThreeJS() {
          const container = document.getElementById('canvas-container');
          this.scene = new THREE.Scene();
          this.scene.fog = new THREE.FogExp2(0x010206, 0.012);

          this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
          
          this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          container.appendChild(this.renderer.domElement);

          // Žiarivé farebné osvetlenie scény (aura efekt)
          this.scene.add(new THREE.AmbientLight(0xffffff, 0.5));
          const pointLight = new THREE.PointLight(0x00f3ff, 3.5, 90);
          pointLight.position.set(15, 15, 15);
          this.scene.add(pointLight);

          const pointLight2 = new THREE.PointLight(0xff007f, 3.5, 90);
          pointLight2.position.set(-15, -15, -15);
          this.scene.add(pointLight2);

          const pointLight3 = new THREE.PointLight(0x9d4edd, 2.5, 90);
          pointLight3.position.set(0, 15, -15);
          this.scene.add(pointLight3);

          // Vesmírna aura a farebná hmlovina v pozadí
          this.createSpaceAuraAndNebula();

          this.polyGroup = new THREE.Group();
          this.scene.add(this.polyGroup);

          // Vnútorné pulzujúce kvantové jadro
          const coreGeo = new THREE.IcosahedronGeometry(0.65, 1);
          const coreMat = new THREE.MeshPhongMaterial({ color: 0xff007f, emissive: 0xff007f, emissiveIntensity: 1.0, wireframe: true });
          this.coreMesh = new THREE.Mesh(coreGeo, coreMat);
          this.polyGroup.add(this.coreMesh);

          // Uzly Polyédra
          this.nodeMeshes = [];
          const sphereGeo = new THREE.SphereGeometry(0.38, 32, 32);

          _nodes.forEach(node => {
            const mat = new THREE.MeshPhongMaterial({
              color: node.phaseColors[1],
              emissive: node.phaseColors[1],
              emissiveIntensity: 0.4,
              shininess: 140,
              wireframe: true
            });
            const mesh = new THREE.Mesh(sphereGeo, mat);
            mesh.position.set(...node.pos);
            mesh.userData = { id: node.id };
            this.polyGroup.add(mesh);
            this.nodeMeshes.push(mesh);
          });

          // Laserové hrany polyédra
          this.laserLines = [];
          _connections.forEach(conn => {
            const posA = new THREE.Vector3(..._nodes[conn[0]].pos);
            const posB = new THREE.Vector3(..._nodes[conn[1]].pos);
            const geo = new THREE.BufferGeometry().setFromPoints([posA, posB]);
            const mat = new THREE.LineBasicMaterial({ color: 0x1a2638, transparent: true, opacity: 0.4, linewidth: 2 });
            const line = new THREE.Line(geo, mat);
            this.polyGroup.add(line);
            this.laserLines.push({ line, nodes: conn });
          });

          this.raycaster = new THREE.Raycaster();
          this.mouse = new THREE.Vector2();

          const animate = () => {
            requestAnimationFrame(animate);
            if (this.coreMesh) {
              this.coreMesh.rotation.x += 0.015;
              this.coreMesh.rotation.y += 0.02;
              const s = 1 + Math.sin(Date.now() * 0.004) * 0.22;
              this.coreMesh.scale.set(s, s, s);
            }
            if (this.auraGroup) {
              this.auraGroup.rotation.y += 0.0004;
              this.auraGroup.rotation.z += 0.0002;
            }
            this.renderer.render(this.scene, this.camera);
          };
          animate();
        },

        createSpaceAuraAndNebula() {
          this.auraGroup = new THREE.Group();

          // Farebné mraky vesmírnej hmloviny s vysokou žiarou
          const colors = [0x00f3ff, 0xff007f, 0x9d4edd, 0xffd700];
          colors.forEach((col, idx) => {
            const count = 350;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            for(let i = 0; i < count * 3; i += 3) {
              pos[i] = (Math.random() - 0.5) * 65;
              pos[i+1] = (Math.random() - 0.5) * 65;
              pos[i+2] = (Math.random() - 0.5) * 65;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({
              size: 1.2 + idx * 0.4,
              color: col,
              transparent: true,
              opacity: 0.22,
              blending: THREE.AdditiveBlending
            });
            this.auraGroup.add(new THREE.Points(geo, mat));
          });

          // Žiarivá centrálna aura v pozadí
          const glowGeo = new THREE.PlaneGeometry(32, 32);
          const glowCanvas = document.createElement('canvas');
          glowCanvas.width = 512; glowCanvas.height = 512;
          const gCtx = glowCanvas.getContext('2d');
          const grad = gCtx.createRadialGradient(256, 256, 10, 256, 256, 250);
          grad.addColorStop(0, 'rgba(0, 243, 255, 0.18)');
          grad.addColorStop(0.4, 'rgba(255, 0, 127, 0.08)');
          grad.addColorStop(0.8, 'rgba(157, 78, 221, 0.03)');
          grad.addColorStop(1, 'rgba(1, 2, 6, 0)');
          gCtx.fillStyle = grad;
          gCtx.fillRect(0, 0, 512, 512);

          const glowTex = new THREE.CanvasTexture(glowCanvas);
          const glowMat = new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false });
          const glowMesh = new THREE.Mesh(glowGeo, glowMat);
          glowMesh.position.z = -14;
          this.scene.add(glowMesh);

          this.scene.add(this.auraGroup);
        },

        setupEvents() {
          window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.adjustCameraForScreen();
          });

          const nameInput = document.getElementById('player-name-input');
          if (nameInput) {
            nameInput.addEventListener('input', (e) => {
              const clean = e.target.value.replace(/[^a-zA-Z0-9\-_ ]/g, '').trim();
              _player = clean || "AGENT-3000";
            });
          }

          const handleTimeChange = (val) => {
            _timePhase = parseInt(val);
            document.getElementById('time-slider').value = _timePhase;
            AudioEngine.init();
            AudioEngine.playLaser();
            this.updateTimePhaseVisuals();
            this.updateHUD();
          };

          document.getElementById('time-slider').addEventListener('input', (e) => handleTimeChange(e.target.value));

          document.getElementById('reset-cam-btn').addEventListener('click', (e) => {
            if (!e.isTrusted) return;
            AudioEngine.init();
            AudioEngine.playTone(600, 'sine', 0.1);
            this.adjustCameraForScreen();
            this.polyGroup.rotation.set(0, 0, 0);
          });

          document.getElementById('oracle-btn').addEventListener('click', (e) => {
            if (!e.isTrusted) return;
            AudioEngine.init();
            AudioEngine.playTone(900, 'square', 0.2);
            showToast("AI ORÁKULUM: Prepojenia v minulosti (t₋₁) vyvolávajú rezonanciu v prítomnosti (t₀). Hľadaj symetriu.");
          });

          document.getElementById('challenge-btn').addEventListener('click', (e) => {
            if (!e.isTrusted) return;
            AudioEngine.init();
            AudioEngine.playTone(750, 'sine', 0.15);
            const totalStab = this.getTotalStabilization();
            const shareText = `✨ Riešim 3D sci-fi kvantový polyéder CHRONO-POLYHEDRON 3000!\n⚡ Stabilizácia: ${totalStab}% | Ťahy: ${_moves}\nTrúfneš si prekonať túto vesmírnu výzvu? 👉 ${window.location.href}`;
            if (navigator.clipboard) {
              navigator.clipboard.writeText(shareText);
            }
            showToast("Virálna výzva bola skopírovaná do schránky! Zdieľaj ju na sociálnych sieťach.");
          });

          document.getElementById('rage-btn').addEventListener('click', (e) => {
            if (!e.isTrusted) return;
            AudioEngine.init();
            AudioEngine.playTone(150, 'sawtooth', 0.3);
            showToast(`RAGE QUIT: ${_player} opustil vesmírnu os pri ${_moves} ťahoch.`);
          });

          document.getElementById('close-cert-btn').addEventListener('click', () => {
            document.getElementById('cert-modal').style.display = 'none';
          });

          document.getElementById('download-cert-btn').addEventListener('click', () => {
            this.downloadCertificate();
          });

          const dom = this.renderer.domElement;
          let isInteracting = false;
          let prevX = 0, prevY = 0;
          let startX = 0, startY = 0;

          const handleStart = (x, y) => {
            AudioEngine.init();
            isInteracting = true;
            prevX = x; prevY = y;
            startX = x; startY = y;
          };

          const handleMove = (x, y) => {
            if (!isInteracting) return;
            const deltaX = x - prevX;
            const deltaY = y - prevY;

            this.polyGroup.rotation.y += deltaX * 0.0085;
            this.polyGroup.rotation.x += deltaY * 0.0085;

            prevX = x; prevY = y;
          };

          const handleEnd = (x, y) => {
            if (!isInteracting) return;
            isInteracting = false;

            const dist = Math.hypot(x - startX, y - startY);
            if (dist < 10) {
              this.mouse.x = (startX / window.innerWidth) * 2 - 1;
              this.mouse.y = -(startY / window.innerHeight) * 2 + 1;

              this.raycaster.setFromCamera(this.mouse, this.camera);
              const intersects = this.raycaster.intersectObjects(this.nodeMeshes);

              if (intersects.length > 0) {
                this.handleNodeClick(intersects[0].object.userData.id);
              }
            }
          };

          dom.addEventListener('mousedown', (e) => { if (e.isTrusted) handleStart(e.clientX, e.clientY); });
          window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
          window.addEventListener('mouseup', (e) => handleEnd(e.clientX, e.clientY));

          dom.addEventListener('touchstart', (e) => {
            if (e.isTrusted && e.touches.length === 1) handleStart(e.touches[0].clientX, e.touches[0].clientY);
          }, { passive: true });

          window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) handleMove(e.touches[0].clientX, e.touches[0].clientY);
          }, { passive: true });

          window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1) handleEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
          });
        },

        handleNodeClick(id) {
          if (_isSolved) return;

          const pIdx = _timePhase + 1;
          const node = _nodes[id];
          node.active[pIdx] = !node.active[pIdx];
          _moves++;

          AudioEngine.playTone(360 + id * 55, 'sine', 0.14, 0.18);

          if (pIdx === 0 && node.active[0]) {
            node.active[1] = !node.active[1];
          }

          this.updateTimePhaseVisuals();
          this.checkWinCondition();
          this.updateHUD();
        },

        updateTimePhaseVisuals() {
          const pIdx = _timePhase + 1;

          this.nodeMeshes.forEach((mesh, idx) => {
            const isActive = _nodes[idx].active[pIdx];
            const activeColor = _nodes[idx].phaseColors[pIdx];

            mesh.material.color.setHex(isActive ? activeColor : 0x223344);
            mesh.material.emissive.setHex(isActive ? activeColor : 0x000000);
            mesh.material.emissiveIntensity = isActive ? 0.85 : 0;
            mesh.material.wireframe = !isActive;
          });

          this.laserLines.forEach(item => {
            const [a, b] = item.nodes;
            const activeA = _nodes[a].active[pIdx];
            const activeB = _nodes[b].active[pIdx];

            if (activeA && activeB) {
              item.line.material.color.setHex(_nodes[a].phaseColors[pIdx]);
              item.line.material.opacity = 0.95;
            } else {
              item.line.material.color.setHex(0x1a2638);
              item.line.material.opacity = 0.3;
            }
          });
        },

        getTotalStabilization() {
          let totalActive = 0;
          _nodes.forEach(n => {
            if (n.active[0]) totalActive++;
            if (n.active[1]) totalActive++;
            if (n.active[2]) totalActive++;
          });
          return Math.round((totalActive / (_nodes.length * 3)) * 100);
        },

        checkWinCondition() {
          if (this.getTotalStabilization() === 100 && !_isSolved) {
            _isSolved = true;
            AudioEngine.playFanfare();
            setTimeout(() => this.triggerVictory(), 350);
          }
        },

        updateHUD() {
          const phases = ["PAST (t₋₁)", "PRESENT (t₀)", "FUTURE (t₊₁)"];
          const currentPhaseText = phases[_timePhase + 1];

          document.getElementById('phase-val').innerText = currentPhaseText;
          document.getElementById('phase-val-top').innerText = currentPhaseText;

          const totalPercent = this.getTotalStabilization();
          
          document.getElementById('stab-val').innerText = `${totalPercent}%`;
          document.getElementById('stab-val-top').innerText = `${totalPercent}%`;

          document.getElementById('moves-val').innerText = _moves;
          document.getElementById('moves-val-top').innerText = _moves;

          const strain = Math.min(100, Math.max(15, _moves * 3));
          document.getElementById('strain-fill').style.width = `${strain}%`;
          document.getElementById('strain-val').innerText = `IQ ${180 - Math.floor(strain / 4)}`;
        },

        triggerVictory() {
          document.getElementById('cert-modal').style.display = 'flex';
          this.build3DCertificate();
        },

        build3DCertificate() {
          const container = document.getElementById('cert-canvas-container');
          container.innerHTML = '';

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
          camera.position.set(0, 0, 5);

          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
          renderer.setSize(container.clientWidth, container.clientHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          container.appendChild(renderer.domElement);

          const plaqueGeo = new THREE.BoxGeometry(3.6, 2.2, 0.1);
          
          const canvas = document.createElement('canvas');
          canvas.width = 1024;
          canvas.height = 640;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#060a14';
          ctx.fillRect(0, 0, 1024, 640);

          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 12;
          ctx.strokeRect(20, 20, 984, 600);

          ctx.fillStyle = '#ffd700';
          ctx.font = 'bold 36px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('QUANTUM POLYHEDRON MASTER', 512, 100);

          ctx.fillStyle = '#00f3ff';
          ctx.font = '26px sans-serif';
          ctx.fillText('CERTIFIKÁT O STABILIZÁCII VESMÍRU', 512, 160);

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 46px sans-serif';
          ctx.fillText(_player, 512, 280);

          ctx.fillStyle = '#a0aec0';
          ctx.font = '22px sans-serif';
          ctx.fillText('Úspešne prepojil všetkých 36 kvantových uzlov', 512, 360);
          ctx.fillText(`Počet ťahov: ${_moves} • Časová rezonancia: 100%`, 512, 410);

          const certHash = "SHA256-VERIFIED:" + btoa(`${_player}_${_moves}_${_sessionSig}`).substr(0, 22);
          ctx.fillStyle = '#ff007f';
          ctx.font = '16px monospace';
          ctx.fillText(certHash, 512, 530);

          const texture = new THREE.CanvasTexture(canvas);
          const mat = new THREE.MeshPhongMaterial({ map: texture, shininess: 95 });
          const plaque = new THREE.Mesh(plaqueGeo, mat);
          scene.add(plaque);

          const light1 = new THREE.PointLight(0xffd700, 2.5, 20);
          light1.position.set(3, 3, 4);
          scene.add(light1);

          scene.add(new THREE.AmbientLight(0xffffff, 0.6));

          this.certRenderer = renderer;

          const certAnimate = () => {
            if (document.getElementById('cert-modal').style.display === 'flex') {
              requestAnimationFrame(certAnimate);
              plaque.rotation.y = Math.sin(Date.now() * 0.0015) * 0.22;
              plaque.rotation.x = Math.cos(Date.now() * 0.0012) * 0.1;
              renderer.render(scene, camera);
            }
          };
          certAnimate();
        },

        downloadCertificate() {
          if (!this.certRenderer) return;
          const dataURL = this.certRenderer.domElement.toDataURL('image/png');
          const link = document.createElement('a');
          link.download = `ChronoPolyhedron_3000_Certificate_${_player}.png`;
          link.href = dataURL;
          link.click();
        }
      };
    })();

    window.addEventListener('DOMContentLoaded', () => {
      QuantumPolyhedronEngine.init();
    });
  </script>
