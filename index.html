<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CHRONO-CUBE 3000: Mobile Side-Controls FX Edition</title>
  <style>
    :root {
      --bg: #030712;
      --primary: #00f3ff;
      --secondary: #ff007f;
      --gold: #ffd700;
      --panel: rgba(10, 15, 30, 0.85);
      --font: 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); color: #fff; touch-action: none; }

    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

    /* HUD Overlay */
    .hud { position: absolute; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; width: 100%; height: 100%; }
    .hud * { pointer-events: auto; }

    header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    
    .title-box {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 14px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
      flex: 1;
      min-width: 170px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    h1 { font-size: 1.05rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--primary); text-shadow: 0 0 10px var(--primary); }
    .sub { font-size: 0.6rem; color: #8a99ad; margin-top: 2px; }

    .user-profile {
      background: var(--panel);
      border: 1px solid rgba(255, 0, 127, 0.4);
      padding: 6px 10px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .user-profile label { font-size: 0.65rem; color: var(--secondary); text-transform: uppercase; font-weight: bold; }
    .user-profile input {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--primary);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.75rem;
      outline: none;
      width: 95px;
    }

    /* Side Panel Stats (Desktop) */
    .side-panel { position: absolute; right: 12px; top: 75px; display: flex; flex-direction: column; gap: 8px; width: 200px; z-index: 10; }
    .stat-card {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 3px solid var(--primary);
      padding: 8px 12px;
      border-radius: 8px;
      backdrop-filter: blur(12px);
    }
    .stat-label { font-size: 0.65rem; color: #8a99ad; text-transform: uppercase; }
    .stat-value { font-size: 1.05rem; font-weight: bold; color: #fff; margin-top: 2px; }

    .strain-bar-bg { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; margin-top: 4px; overflow: hidden; }
    .strain-bar-fill { height: 100%; width: 10%; background: linear-gradient(90deg, #00f3ff, #ff007f); }

    /* Footer & Tlačidlá (Desktop) */
    .desktop-footer { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; width: 100%; }
    
    .time-control {
      background: var(--panel);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(0, 243, 255, 0.4);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 340px;
      justify-content: center;
    }
    .time-slider { flex: 1; accent-color: var(--primary); cursor: pointer; height: 20px; }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    
    .btn {
      background: rgba(0, 243, 255, 0.12);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      transition: all 0.2s;
      backdrop-filter: blur(8px);
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
    .btn-secondary { border-color: var(--secondary); color: var(--secondary); background: rgba(255, 0, 127, 0.12); }
    .btn-secondary:hover { background: var(--secondary); color: #fff; box-shadow: 0 0 15px var(--secondary); }
    .btn-gold { border-color: var(--gold); color: var(--gold); background: rgba(255, 215, 0, 0.12); }
    .btn-gold:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold); }

    /* Mobilný panel tlačidiel po bokoch (skrytý na PC) */
    .mobile-side-controls { display: none; }

    /* Responsive Mobile Layout: Tlačidla po bokoch, kocka v strede */
    @media (max-width: 768px) {
      .hud { padding: 6px; justify-content: flex-start; }
      header { margin-bottom: 4px; }
      .side-panel { display: none; } /* Úplne skryté alebo môžeme nechať v minimalistickej forme */
      
      .desktop-footer { display: none; } /* Vypneme klasický spodný panel */
      
      .mobile-side-controls {
        display: flex;
        position: absolute;
        top: 60px;
        bottom: 10px;
        left: 0;
        width: 100%;
        justify-content: space-between;
        align-items: center;
        padding: 0 6px;
        pointer-events: none;
        z-index: 20;
      }

      .control-column {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 90px;
        pointer-events: auto;
      }

      .control-column .btn {
        padding: 8px 4px;
        font-size: 0.6rem;
        width: 100%;
        background: rgba(10, 15, 30, 0.9);
      }

      /* Mobilný časový posuvník priamo hore pod hlavičkou */
      .mobile-top-time {
        display: flex;
        background: var(--panel);
        border: 1px solid rgba(0, 243, 255, 0.3);
        padding: 4px 10px;
        border-radius: 12px;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
        pointer-events: auto;
      }
    }

    /* Pre PC skryjeme mobilný horný časovač */
    .mobile-top-time { display: none; }
    @media (max-width: 768px) {
      .mobile-top-time { display: flex; }
    }

    /* Modal */
    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px); z-index: 100; display: none; justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background: #0b1120; border: 1px solid var(--gold); border-radius: 16px; padding: 20px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 0 40px rgba(255, 215, 0, 0.3); }
    .modal-title { color: var(--gold); font-size: 1.3rem; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 0 10px var(--gold); }
    #cert-canvas-container { width: 100%; height: 210px; margin: 10px 0; border-radius: 10px; border: 1px solid rgba(255, 215, 0, 0.3); background: #050a14; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="hud">
    <header>
      <div class="title-box">
        <h1>Chrono-Cube 3000</h1>
        <div class="sub">Quantum Hypercube • Mobile FX</div>
      </div>

      <div class="mobile-top-time">
        <span style="font-size: 0.65rem; color: #8a99ad;">t₋₁</span>
        <input type="range" min="-1" max="1" value="0" step="1" class="time-slider" id="time-slider-m">
        <span style="font-size: 0.65rem; color: #8a99ad;">t₊₁</span>
      </div>

      <div class="user-profile">
        <label for="player-name">Hráč:</label>
        <input type="text" id="player-name" value="AGENT-3000" maxlength="12">
      </div>
    </header>

    <!-- Desktopové štatistiky vpravo hore -->
    <div class="side-panel">
      <div class="stat-card">
        <div class="stat-label">Časový stav</div>
        <div class="stat-value" id="phase-val" style="color: var(--primary);">PRESENT (t₀)</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Stabilizácia</div>
        <div class="stat-value" id="stab-val">0%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Brain Strain</div>
        <div class="stat-value" id="strain-val">IQ 145</div>
        <div class="strain-bar-bg"><div class="strain-bar-fill" id="strain-fill"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Počet ťahov</div>
        <div class="stat-value" id="moves-val">0</div>
      </div>
    </div>

    <!-- Mobilné ovládacie prvky umiestnené presne PO BOKOCH displeja -->
    <div class="mobile-side-controls">
      <div class="control-column">
        <button class="btn" id="reset-cam-btn-m">Reset Pohľadu</button>
        <button class="btn btn-secondary" id="oracle-btn-m">AI Orákulum</button>
      </div>
      <div class="control-column">
        <button class="btn btn-secondary" id="challenge-btn-m">Výzva</button>
        <button class="btn btn-gold" id="rage-btn-m">Rage Quit</button>
      </div>
    </div>

    <!-- Desktopový spodný panel -->
    <footer class="desktop-footer">
      <div class="time-control">
        <span style="font-size: 0.75rem; color: #8a99ad;">t₋₁</span>
        <input type="range" min="-1" max="1" value="0" step="1" class="time-slider" id="time-slider">
        <span style="font-size: 0.75rem; color: #8a99ad;">t₊₁</span>
      </div>

      <div class="btn-group">
        <button class="btn" id="reset-cam-btn">Reset Pohľadu</button>
        <button class="btn btn-secondary" id="oracle-btn">AI Orákulum</button>
        <button class="btn btn-secondary" id="challenge-btn">Výzva</button>
        <button class="btn btn-gold" id="rage-btn">Rage Quit</button>
      </div>
    </footer>
  </div>

  <!-- Certificate Modal -->
  <div class="modal" id="cert-modal">
    <div class="modal-content">
      <div class="modal-title">✨ Kvantový Certifikát ✨</div>
      <p style="font-size: 0.8rem; color: #a0aec0;">Stabilizácia kvantovej mriežky dokončená na 100%.</p>
      
      <div id="cert-canvas-container"></div>

      <div style="display: flex; gap: 8px; justify-content: center; margin-top: 10px;">
        <button class="btn btn-gold" id="download-cert-btn">Stiahnuť PNG</button>
        <button class="btn" id="close-cert-btn">Zatvoriť</button>
      </div>
    </div>
  </div>

  <script>
    const QuantumGameEngine = (function() {
      let _sessionSig = Math.random().toString(36).substring(2) + Date.now().toString(36);
      let _player = "AGENT-3000";
      let _timePhase = 0;
      let _moves = 0;
      let _isSolved = false;

      const _nodes = [
        { id: 0, pos: [-2, 2, 2], phaseColors: [0x00f3ff, 0xff007f, 0xffd700], active: [false, false, false] },
        { id: 1, pos: [2, 2, 2], phaseColors: [0xff007f, 0x00f3ff, 0xffd700], active: [false, false, false] },
        { id: 2, pos: [2, -2, 2], phaseColors: [0xffd700, 0xff007f, 0x00f3ff], active: [false, false, false] },
        { id: 3, pos: [-2, -2, 2], phaseColors: [0x00f3ff, 0xffd700, 0xff007f], active: [false, false, false] },
        { id: 4, pos: [-2, 2, -2], phaseColors: [0xff007f, 0xffd700, 0x00f3ff], active: [false, false, false] },
        { id: 5, pos: [2, 2, -2], phaseColors: [0x00f3ff, 0xff007f, 0xffd700], active: [false, false, false] },
        { id: 6, pos: [2, -2, -2], phaseColors: [0xffd700, 0x00f3ff, 0xff007f], active: [false, false, false] },
        { id: 7, pos: [-2, -2, -2], phaseColors: [0xff007f, 0x00f3ff, 0xffd700], active: [false, false, false] }
      ];

      const _connections = [
        [0,1], [1,2], [2,3], [3,0],
        [4,5], [5,6], [6,7], [7,4],
        [0,4], [1,5], [2,6], [3,7]
      ];

      const AudioEngine = {
        ctx: null,
        init() {
          if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
          if (!this.ctx) return;
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
          } catch(e){}
        },
        playLaser() {
          if (!this.ctx) return;
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
          } catch(e){}
        },
        playFanfare() {
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
          notes.forEach((n, i) => {
            setTimeout(() => this.playTone(n, 'triangle', 0.4, 0.15), i * 120);
          });
        }
      };

      return {
        init() {
          this.setupThreeJS();
          this.setupEvents();
          this.updateHUD();
          this.adjustCameraForScreen();
        },

        adjustCameraForScreen() {
          const isMobile = window.innerWidth <= 768;
          const dist = isMobile ? 12.5 : 9.5;
          this.camera.position.set(dist * 0.65, dist * 0.65, dist);
          this.camera.lookAt(0, 0, 0);
        },

        setupThreeJS() {
          const container = document.getElementById('canvas-container');
          this.scene = new THREE.Scene();
          this.scene.fog = new THREE.FogExp2(0x030712, 0.025);

          this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
          
          this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          container.appendChild(this.renderer.domElement);

          this.scene.add(new THREE.AmbientLight(0xffffff, 0.3));
          const pointLight = new THREE.PointLight(0x00f3ff, 2, 50);
          pointLight.position.set(10, 10, 10);
          this.scene.add(pointLight);

          const pointLight2 = new THREE.PointLight(0xff007f, 2, 50);
          pointLight2.position.set(-10, -10, -10);
          this.scene.add(pointLight2);

          this.cubeGroup = new THREE.Group();
          this.scene.add(this.cubeGroup);

          const coreGeo = new THREE.IcosahedronGeometry(0.7, 2);
          const coreMat = new THREE.MeshPhongMaterial({ color: 0xff007f, emissive: 0xff007f, emissiveIntensity: 0.6, wireframe: true });
          this.coreMesh = new THREE.Mesh(coreGeo, coreMat);
          this.cubeGroup.add(this.coreMesh);

          this.nodeMeshes = [];
          const sphereGeo = new THREE.SphereGeometry(0.38, 32, 32);

          _nodes.forEach(node => {
            const mat = new THREE.MeshPhongMaterial({
              color: node.phaseColors[1],
              emissive: node.phaseColors[1],
              emissiveIntensity: 0.2,
              shininess: 100,
              wireframe: true
            });
            const mesh = new THREE.Mesh(sphereGeo, mat);
            mesh.position.set(...node.pos);
            mesh.userData = { id: node.id };
            this.cubeGroup.add(mesh);
            this.nodeMeshes.push(mesh);
          });

          this.laserLines = [];
          _connections.forEach(conn => {
            const posA = new THREE.Vector3(..._nodes[conn[0]].pos);
            const posB = new THREE.Vector3(..._nodes[conn[1]].pos);
            const geo = new THREE.BufferGeometry().setFromPoints([posA, posB]);
            const mat = new THREE.LineBasicMaterial({ color: 0x1a2638, transparent: true, opacity: 0.3, linewidth: 2 });
            const line = new THREE.Line(geo, mat);
            this.cubeGroup.add(line);
            this.laserLines.push({ line, nodes: conn });
          });

          const partGeo = new THREE.BufferGeometry();
          const partCount = 600;
          const posArray = new Float32Array(partCount * 3);
          for(let i=0; i<partCount*3; i++) posArray[i] = (Math.random() - 0.5) * 35;
          partGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
          this.particles = new THREE.Points(partGeo, new THREE.PointsMaterial({ size: 0.06, color: 0x00f3ff, transparent: true, opacity: 0.4 }));
          this.scene.add(this.particles);

          this.raycaster = new THREE.Raycaster();
          this.mouse = new THREE.Vector2();

          const animate = () => {
            requestAnimationFrame(animate);
            if (this.coreMesh) {
              this.coreMesh.rotation.x += 0.01;
              this.coreMesh.rotation.y += 0.015;
              let s = 1 + Math.sin(Date.now() * 0.003) * 0.15;
              this.coreMesh.scale.set(s, s, s);
            }
            if (this.particles) this.particles.rotation.y += 0.0004;
            this.renderer.render(this.scene, this.camera);
          };
          animate();
        },

        setupEvents() {
          window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.adjustCameraForScreen();
          });

          document.getElementById('player-name').addEventListener('input', (e) => {
            _player = e.target.value || "AGENT-3000";
          });

          const handleTimeChange = (val) => {
            _timePhase = parseInt(val);
            document.getElementById('time-slider').value = _timePhase;
            document.getElementById('time-slider-m').value = _timePhase;
            AudioEngine.init();
            AudioEngine.playLaser();
            this.updateTimePhaseVisuals();
            this.updateHUD();
          };

          document.getElementById('time-slider').addEventListener('input', (e) => handleTimeChange(e.target.value));
          document.getElementById('time-slider-m').addEventListener('input', (e) => handleTimeChange(e.target.value));

          const triggerReset = () => {
            AudioEngine.init();
            AudioEngine.playTone(600, 'sine', 0.1);
            this.adjustCameraForScreen();
            this.cubeGroup.rotation.set(0, 0, 0);
          };
          document.getElementById('reset-cam-btn').addEventListener('click', triggerReset);
          document.getElementById('reset-cam-btn-m').addEventListener('click', triggerReset);

          const triggerOracle = () => {
            AudioEngine.init();
            AudioEngine.playTone(900, 'square', 0.2);
            alert(`[AI ORÁKULUM]: Pre stabilizáciu siete prepínaj dimenzie a aktivuj prepojenia v minulosti (t₋₁)!`);
          };
          document.getElementById('oracle-btn').addEventListener('click', triggerOracle);
          document.getElementById('oracle-btn-m').addEventListener('click', triggerOracle);

          const triggerChallenge = () => {
            AudioEngine.init();
            AudioEngine.playTone(750, 'sine', 0.15);
            const seed = btoa(`${_player}_${Date.now()}_${_sessionSig.substr(0,5)}`);
            navigator.clipboard.writeText(window.location.href + `#challenge=${seed}`);
            alert(`Výzva skopírovaná do schránky!`);
          };
          document.getElementById('challenge-btn').addEventListener('click', triggerChallenge);
          document.getElementById('challenge-btn-m').addEventListener('click', triggerChallenge);

          const triggerRage = () => {
            AudioEngine.init();
            AudioEngine.playTone(150, 'sawtooth', 0.3);
            alert(`[RAGE QUIT]: Hráč ${_player} opustil časovú os.`);
          };
          document.getElementById('rage-btn').addEventListener('click', triggerRage);
          document.getElementById('rage-btn-m').addEventListener('click', triggerRage);

          document.getElementById('close-cert-btn').addEventListener('click', () => {
            document.getElementById('cert-modal').style.display = 'none';
          });

          document.getElementById('download-cert-btn').addEventListener('click', () => {
            this.downloadCertificate();
          });

          const dom = this.renderer.domElement;
          let isInteracting = false;
          let prevX = 0, prevY = 0;
          let startX = 0, startY = 0;

          const handleStart = (x, y) => {
            AudioEngine.init();
            isInteracting = true;
            prevX = x; prevY = y;
            startX = x; startY = y;
          };

          const handleMove = (x, y) => {
            if (!isInteracting) return;
            const deltaX = x - prevX;
            const deltaY = y - prevY;

            this.cubeGroup.rotation.y += deltaX * 0.008;
            this.cubeGroup.rotation.x += deltaY * 0.008;

            prevX = x; prevY = y;
          };

          const handleEnd = (x, y) => {
            if (!isInteracting) return;
            isInteracting = false;

            const dist = Math.hypot(x - startX, y - startY);
            if (dist < 8) {
              this.mouse.x = (startX / window.innerWidth) * 2 - 1;
              this.mouse.y = -(startY / window.innerHeight) * 2 + 1;

              this.raycaster.setFromCamera(this.mouse, this.camera);
              const intersects = this.raycaster.intersectObjects(this.nodeMeshes);

              if (intersects.length > 0) {
                this.handleNodeClick(intersects[0].object.userData.id);
              }
            }
          };

          dom.addEventListener('mousedown', (e) => handleStart(e.clientX, e.clientY));
          window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
          window.addEventListener('mouseup', (e) => handleEnd(e.clientX, e.clientY));

          dom.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) handleStart(e.touches[0].clientX, e.touches[0].clientY);
          }, { passive: true });

          window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) handleMove(e.touches[0].clientX, e.touches[0].clientY);
          }, { passive: true });

          window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1) handleEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
          });
        },

        handleNodeClick(id) {
          if (_isSolved) return;

          const pIdx = _timePhase + 1;
          _nodes[id].active[pIdx] = !_nodes[id].active[pIdx];
          _moves++;

          AudioEngine.playTone(350 + id * 70, 'sine', 0.12, 0.15);

          if (pIdx === 0 && _nodes[id].active[0]) {
            _nodes[id].active[1] = !_nodes[id].active[1];
          }

          this.updateTimePhaseVisuals();
          this.checkWinCondition();
          this.updateHUD();
        },

        updateTimePhaseVisuals() {
          const pIdx = _timePhase + 1;

          this.nodeMeshes.forEach((mesh, idx) => {
            const isActive = _nodes[idx].active[pIdx];
            const activeColor = _nodes[idx].phaseColors[pIdx];

            mesh.material.color.setHex(isActive ? activeColor : 0x223344);
            mesh.material.emissive.setHex(isActive ? activeColor : 0x000000);
            mesh.material.emissiveIntensity = isActive ? 0.6 : 0;
            mesh.material.wireframe = !isActive;
          });

          this.laserLines.forEach(item => {
            const [a, b] = item.nodes;
            const activeA = _nodes[a].active[pIdx];
            const activeB = _nodes[b].active[pIdx];

            if (activeA && activeB) {
              item.line.material.color.setHex(_nodes[a].phaseColors[pIdx]);
              item.line.material.opacity = 0.95;
            } else {
              item.line.material.color.setHex(0x1a2638);
              item.line.material.opacity = 0.2;
            }
          });
        },

        checkWinCondition() {
          let totalActive = 0;
          _nodes.forEach(n => {
            if (n.active[0]) totalActive++;
            if (n.active[1]) totalActive++;
            if (n.active[2]) totalActive++;
          });

          const totalNodes = _nodes.length * 3;
          const stabRatio = Math.round((totalActive / totalNodes) * 100);

          if (stabRatio === 100 && !_isSolved) {
            _isSolved = true;
            AudioEngine.playFanfare();
            setTimeout(() => this.triggerVictory(), 300);
          }
        },

        updateHUD() {
          const phases = ["PAST (t₋₁)", "PRESENT (t₀)", "FUTURE (t₊₁)"];
          document.getElementById('phase-val').innerText = phases[_timePhase + 1];

          let activeInPhase = _nodes.filter(n => n.active[_timePhase + 1]).length;
          let percent = Math.round((activeInPhase / _nodes.length) * 100);
          document.getElementById('stab-val').innerText = `${percent}%`;

          document.getElementById('moves-val').innerText = _moves;

          let strain = Math.min(100, Math.max(10, _moves * 4));
          document.getElementById('strain-fill').style.width = `${strain}%`;
          document.getElementById('strain-val').innerText = `IQ ${160 - Math.floor(strain / 3)}`;
        },

        triggerVictory() {
          document.getElementById('cert-modal').style.display = 'flex';
          this.build3DCertificate();
        },

        build3DCertificate() {
          const container = document.getElementById('cert-canvas-container');
          container.innerHTML = '';

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
          camera.position.set(0, 0, 5);

          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
          renderer.setSize(container.clientWidth, container.clientHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          container.appendChild(renderer.domElement);

          const plaqueGeo = new THREE.BoxGeometry(3.6, 2.2, 0.1);
          
          const canvas = document.createElement('canvas');
          canvas.width = 1024;
          canvas.height = 640;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#0a101f';
          ctx.fillRect(0, 0, 1024, 640);

          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 12;
          ctx.strokeRect(20, 20, 984, 600);

          ctx.fillStyle = '#ffd700';
          ctx.font = 'bold 38px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('QUANTUM HYPERCUBE MASTER', 512, 100);

          ctx.fillStyle = '#00f3ff';
          ctx.font = '28px sans-serif';
          ctx.fillText('CERTIFIKÁT O VYRIEŠENÍ HLAVOLAMU', 512, 160);

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 46px sans-serif';
          ctx.fillText(_player, 512, 280);

          ctx.fillStyle = '#a0aec0';
          ctx.font = '22px sans-serif';
          ctx.fillText(`Úspešne stabilizoval všetkých 24 kvantových uzlov`, 512, 360);
          ctx.fillText(`Počet ťahov: ${_moves} • Časová rezonancia: 100%`, 512, 410);

          const certHash = "SHA256-VERIFIED:" + btoa(`${_player}_${_moves}_${_sessionSig}`).substr(0, 20);
          ctx.fillStyle = '#ff007f';
          ctx.font = '16px monospace';
          ctx.fillText(certHash, 512, 530);

          const texture = new THREE.CanvasTexture(canvas);
          const mat = new THREE.MeshPhongMaterial({ map: texture, shininess: 80 });
          const plaque = new THREE.Mesh(plaqueGeo, mat);
          scene.add(plaque);

          const light1 = new THREE.PointLight(0xffd700, 1.5, 20);
          light1.position.set(3, 3, 4);
          scene.add(light1);

          scene.add(new THREE.AmbientLight(0xffffff, 0.6));

          this.certRenderer = renderer;

          const certAnimate = () => {
            if (document.getElementById('cert-modal').style.display === 'flex') {
              requestAnimationFrame(certAnimate);
              plaque.rotation.y = Math.sin(Date.now() * 0.0015) * 0.2;
              plaque.rotation.x = Math.cos(Date.now() * 0.0012) * 0.1;
              renderer.render(scene, camera);
            }
          };
          certAnimate();
        },

        downloadCertificate() {
          if (!this.certRenderer) return;
          const dataURL = this.certRenderer.domElement.toDataURL('image/png');
          const link = document.createElement('a');
          link.download = `ChronoCube_3000_Certificate_${_player}.png`;
          link.href = dataURL;
          link.click();
        }
      };
    })();

    window.addEventListener('DOMContentLoaded', () => {
      QuantumGameEngine.init();
    });
  </script>
</body>
