<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHRONO-POLYHEDRON 3000</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000103; font-family: sans-serif; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    .hud { position: absolute; z-index: 10; padding: 20px; font-size: 1.1rem; color: #00f3ff; text-shadow: 0 0 10px #00f3ff; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div class="hud">CHRONO-POLYHEDRON 3000: SYSTEM ONLINE <br><span id="info" style="font-size:0.8rem; color:#ffd700;">Kliknutím pridáš stabilizáciu.</span></div>
  <div id="canvas-container"></div>
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 6;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const light = new THREE.PointLight(0xff007f, 3, 50);
    light.position.set(5, 5, 5);
    scene.add(light);

    const geometry = new THREE.IcosahedronGeometry(1.8, 1);
    const material = new THREE.MeshPhongMaterial({ color: 0x00f3ff, emissive: 0x00f3ff, emissiveIntensity: 0.3, wireframe: true });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    let count = 0;
    window.addEventListener('click', () => {
      count++;
      material.color.setHex(count % 2 === 0 ? 0x00f3ff : 0xffd700);
      document.getElementById('info').innerText = `Stabilizácia uzlov: ${Math.min(100, count * 15)}%`;
    });

    function animate() {
      requestAnimationFrame(animate);
      mesh.rotation.x += 0.008;
      mesh.rotation.y += 0.012;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
