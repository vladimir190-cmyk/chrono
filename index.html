<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000103">
  <title>CHRONO-POLYHEDRON 3000</title>
  <style>
    :root {
      --bg: #000103;
      --primary: #00f3ff;
      --secondary: #ff007f;
      --gold: #ffd700;
      --panel: rgba(5, 8, 18, 0.92);
      --font: 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); color: #fff; touch-action: none; }

    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

    .hud { position: absolute; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; width: 100%; height: 100%; }
    .hud * { pointer-events: auto; }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(0, 243, 255, 0.55);
      padding: 10px 16px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
    }

    h1 { font-size: 1rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--primary); text-shadow: 0 0 10px var(--primary); }
    p { font-size: 0.75rem; color: #a0aec0; margin-top: 4px; }

    .btn {
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--primary); color: #000103; box-shadow: 0 0 20px var(--primary); }

    .bottom-bar { display: flex; gap: 10px; justify-content: center; align-items: center; margin-bottom: 10px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="hud">
    <div class="panel" style="max-width: 320px;">
      <h1>Chrono-Polyhedron</h1>
      <p id="info-text">Stabilizácia mriežky: 0% | Ťahy: 0</p>
    </div>

    <div class="bottom-bar">
      <button class="btn" id="action-btn">Stabilizovať uzol</button>
      <button class="btn" id="reset-btn" style="border-color: var(--secondary); color: var(--secondary);">Resetovať</button>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      'use strict';

      try {
        const container = document.getElementById('canvas-container');
        if (!container) return;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const light = new THREE.PointLight(0xff007f, 3, 50);
        light.position.set(5, 5, 5);
        scene.add(light);

        const geometry = new THREE.IcosahedronGeometry(1.6, 1);
        const material = new THREE.MeshPhongMaterial({ 
          color: 0x00f3ff, 
          emissive: 0x00f3ff, 
          emissiveIntensity: 0.35, 
          wireframe: true 
        });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        let stabilizationCount = 0;

        function updateInfo() {
          const el = document.getElementById('info-text');
          if (el) {
            const pct = Math.min(100, stabilizationCount * 20);
            el.innerText = `Stabilizácia mriežky: ${pct}% | Ťahy: ${stabilizationCount}`;
          }
        }

        document.getElementById('action-btn').addEventListener('click', () => {
          stabilizationCount++;
          material.color.setHex(stabilizationCount % 2 === 0 ? 0x00f3ff : 0xffd700);
          material.emissive.setHex(stabilizationCount % 2 === 0 ? 0x00f3ff : 0xffd700);
          updateInfo();
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
          stabilizationCount = 0;
          material.color.setHex(0x00f3ff);
          material.emissive.setHex(0x00f3ff);
          updateInfo();
        });

        function animate() {
          requestAnimationFrame(animate);
          mesh.rotation.x += 0.007;
          mesh.rotation.y += 0.01;
          renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

      } catch (err) {
        console.error("Chyba vykresľovania:", err);
      }
    });
  </script>
</body>
</html>
